[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telco-churn-mlops"
version = "0.1.0"
description = "MLOps foundation for the Telco Customer Churn model"
readme = "MLOPS_END_TO_END_DESIGN.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.141.1",
    "joblib==1.5.3",
    "lightgbm==4.7.0",
    "mlflow==3.15.0",
    "numpy==2.2.6",
    "pandas==2.3.3",
    "pandera==0.32.1",
    "python-multipart==0.0.32",
    "scikit-learn==1.6.1",
    "uvicorn==0.52.0",
    "xgboost==3.2.0",
]

[tool.setuptools.packages.find]
where = ["src"]
